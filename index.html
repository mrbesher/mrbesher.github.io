<script>
/* First-paint theme: manual override, else coarse solar elevation at Jyvaskyla. */
(function () {
  try {
    var r = document.documentElement;
    r.className += ' js';
    var t = null;
    var forced = location.search.match(/[?&]theme=(light|dark)/);
    if (forced) t = forced[1];
    if (!t) { try { t = localStorage.getItem('theme'); } catch (e) {} }
    var mode = t ? 'manual' : 'auto';
    if (!t) {
      var d = new Date();
      var doy = (d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
      var dec = -23.44 * Math.cos(2 * Math.PI * (doy + 10) / 365) * Math.PI / 180;
      var lat = 62.2426 * Math.PI / 180;
      var minsUTC = d.getUTCHours() * 60 + d.getUTCMinutes();
      var ha = (((minsUTC + 4 * 25.7473) % 1440) / 4 - 180) * Math.PI / 180;
      var el = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha));
      t = el > -0.02 ? 'light' : 'dark';
    }
    r.dataset.theme = t;
    r.dataset.themeMode = mode;
  } catch (e) {}
})();
</script>
